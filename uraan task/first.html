<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 650px;
            margin: auto;
            border: 3px solid black;
            padding: 10px;
        }

        header {
            height: 55px;
            background-color: red;
            margin-bottom: 10px;
        }

        nav {
            height: 55px;
            background-color: #20a9c5;
            margin-bottom: 10px;
        }

        main {
            display: flex;
            gap: 10px;
            height: 210px;
        }

        section {
            width: 60%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        article {
            flex: 1;
            background-color: orange;
        }

        article:last-child {
            background-color: #f4510b;
        }

        aside {
            width: 40%;
            background-color: #d91ba8;
        }

        footer {
            height: 55px;
            background-color: #222;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <header></header>
        <nav></nav>
        <main>
            <section>
                <article></article>
                <article></article>
            </section>
            <aside></aside>
        </main>
        <footer></footer>
    </div>
</body>
</html>
